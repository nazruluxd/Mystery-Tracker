<!DOCTYPE html>
<html lang="bn">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>🔍 Mystery Tracker Bangladesh</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body {
      background: linear-gradient(135deg, #020617 0%, #0f172a 50%, #1e293b 100%);
      min-height: 100vh;
      color: white;
      font-family: Arial, sans-serif;
    }

    .glass {
      backdrop-filter: blur(20px);
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .fade-in {
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0px);
      }
    }

    textarea::-webkit-scrollbar,
    div::-webkit-scrollbar {
      width: 8px;
    }

    textarea::-webkit-scrollbar-thumb,
    div::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 20px;
    }
  </style>
</head>

<body>

  <div class="max-w-7xl mx-auto p-6">

    <div class="text-center mb-10">

      <h1 class="text-5xl font-bold mb-4">
        🔍 Mystery Tracker Bangladesh
      </h1>

      <p class="text-slate-300 text-lg">
        বাংলাদেশের ভাইরাল, রহস্যময় ও ডিজিটাল ইস্যু ট্র্যাকার
      </p>

    </div>

    <!-- SINGLE ADD -->

    <div class="glass rounded-3xl p-6 mb-8">

      <h2 class="text-2xl font-bold mb-6">
        Add Single Mystery
      </h2>

      <div class="grid md:grid-cols-3 gap-4">

        <input id="title" type="text" placeholder="Mystery title..."
          class="bg-slate-900/70 border border-slate-700 rounded-xl p-3 outline-none" />

        <select id="priority"
          class="bg-slate-900/70 border border-slate-700 rounded-xl p-3 outline-none">
          <option>Low</option>
          <option>Medium</option>
          <option>High</option>
        </select>

        <button onclick="addMystery()"
          class="bg-cyan-500 hover:bg-cyan-600 rounded-xl p-3 font-bold transition-all">
          Add Mystery
        </button>

      </div>

      <textarea id="description" placeholder="Description..."
        class="w-full mt-4 bg-slate-900/70 border border-slate-700 rounded-xl p-4 outline-none h-32"></textarea>

    </div>

    <!-- BULK IMPORT -->

    <div class="glass rounded-3xl p-6 mb-8">

      <div class="flex flex-wrap gap-4 justify-between items-center mb-4">

        <h2 class="text-2xl font-bold">
          Bulk Import Mysteries
        </h2>

        <button onclick="loadBangladeshMysteries()"
          class="bg-purple-500 hover:bg-purple-600 px-5 py-3 rounded-xl font-bold transition-all">
          Auto Load 50 Mysteries
        </button>

      </div>

      <textarea id="bulkInput" placeholder="Paste full mystery article here..."
        class="w-full h-72 bg-slate-900/70 border border-slate-700 rounded-xl p-4 outline-none"></textarea>

      <button onclick="importBulkText()"
        class="mt-4 bg-green-500 hover:bg-green-600 px-6 py-3 rounded-xl font-bold transition-all">
        Import From Text
      </button>

    </div>

    <!-- STATS -->

    <div class="grid md:grid-cols-4 gap-4 mb-8">

      <div class="glass rounded-2xl p-6 text-center">
        <h2 class="text-slate-300 text-sm mb-2">
          Total
        </h2>

        <p id="totalCount" class="text-4xl font-bold">
          0
        </p>
      </div>

      <div class="glass rounded-2xl p-6 text-center">
        <h2 class="text-slate-300 text-sm mb-2">
          Solved
        </h2>

        <p id="solvedCount" class="text-4xl font-bold text-green-400">
          0
        </p>
      </div>

      <div class="glass rounded-2xl p-6 text-center">
        <h2 class="text-slate-300 text-sm mb-2">
          Unsolved
        </h2>

        <p id="unsolvedCount" class="text-4xl font-bold text-red-400">
          0
        </p>
      </div>

      <div class="glass rounded-2xl p-6 text-center">

        <h2 class="text-slate-300 text-sm mb-2">
          Search
        </h2>

        <input id="searchInput" onkeyup="renderMysteries()" placeholder="Search..."
          class="w-full bg-slate-900/70 border border-slate-700 rounded-lg p-2 outline-none" />

      </div>

    </div>

    <!-- LIST -->

    <div id="mysteryList" class="grid md:grid-cols-2 gap-6"></div>

  </div>

  <script>

    let mysteries =
      JSON.parse(localStorage.getItem('mysteries')) || []

    function saveMysteries() {

      localStorage.setItem(
        'mysteries',
        JSON.stringify(mysteries)
      )
    }

    function updateStats() {

      document.getElementById('totalCount').innerText =
        mysteries.length

      const solved =
        mysteries.filter(m => m.solved).length

      document.getElementById('solvedCount').innerText =
        solved

      document.getElementById('unsolvedCount').innerText =
        mysteries.length - solved
    }

    function addMystery() {

      const title =
        document.getElementById('title').value.trim()

      const description =
        document.getElementById('description').value.trim()

      const priority =
        document.getElementById('priority').value

      if (!title || !description) {

        alert('Please fill all fields')

        return
      }

      mysteries.unshift({
        title,
        description,
        priority,
        solved: false
      })

      saveMysteries()

      renderMysteries()

      document.getElementById('title').value = ''
      document.getElementById('description').value = ''
    }

    function deleteMystery(index) {

      if (!confirm('Delete this mystery?')) {
        return
      }

      mysteries.splice(index, 1)

      saveMysteries()

      renderMysteries()
    }

    function toggleSolved(index) {

      mysteries[index].solved =
        !mysteries[index].solved

      saveMysteries()

      renderMysteries()
    }

    function editMystery(index) {

      const mystery =
        mysteries[index]

      const newTitle =
        prompt('Edit title:', mystery.title)

      if (newTitle === null) return

      const newDescription =
        prompt(
          'Edit description:',
          mystery.description
        )

      if (newDescription === null) return

      const newPriority =
        prompt(
          'Edit priority (Low/Medium/High):',
          mystery.priority
        )

      if (newPriority === null) return

      mysteries[index] = {
        ...mystery,
        title: newTitle,
        description: newDescription,
        priority: newPriority
      }

      saveMysteries()

      renderMysteries()

      alert('Mystery updated!')
    }

    function renderMysteries() {

      const container =
        document.getElementById('mysteryList')

      const search =
        document.getElementById('searchInput')
          .value
          .toLowerCase()

      container.innerHTML = ''

      mysteries
        .filter(item =>
          item.title.toLowerCase().includes(search) ||
          item.description.toLowerCase().includes(search)
        )
        .forEach((mystery, index) => {

          const card =
            document.createElement('div')

          card.className =
            'glass rounded-3xl p-6 fade-in'

          card.innerHTML = `
            <div class="flex justify-between items-start gap-4">

              <div class="flex-1">

                <div class="flex flex-wrap gap-2 items-center mb-4">

                  <h2 class="text-3xl font-bold">
                    ${mystery.title}
                  </h2>

                  <span class="
                    px-3 py-1 rounded-full text-sm
                    ${
                      mystery.priority === 'High'
                        ? 'bg-red-500/20 text-red-300'
                        : mystery.priority === 'Medium'
                        ? 'bg-yellow-500/20 text-yellow-300'
                        : 'bg-green-500/20 text-green-300'
                    }
                  ">
                    ${mystery.priority}
                  </span>

                </div>

                <p class="text-slate-300 whitespace-pre-wrap leading-8 text-lg">
                  ${mystery.description}
                </p>

              </div>

            </div>

            <div class="flex flex-wrap gap-3 mt-6">

              <button
                onclick="toggleSolved(${index})"
                class="
                  px-4 py-2 rounded-xl font-bold
                  ${
                    mystery.solved
                      ? 'bg-green-500 hover:bg-green-600'
                      : 'bg-slate-700 hover:bg-slate-600'
                  }
                "
              >
                ${mystery.solved ? 'Solved' : 'Mark Solved'}
              </button>

              <button
                onclick="editMystery(${index})"
                class="bg-yellow-500 hover:bg-yellow-600 px-4 py-2 rounded-xl font-bold"
              >
                Edit
              </button>

              <button
                onclick="deleteMystery(${index})"
                class="bg-red-500 hover:bg-red-600 px-4 py-2 rounded-xl font-bold"
              >
                Delete
              </button>

            </div>
          `

          container.appendChild(card)
        })

      updateStats()
    }

    function importBulkText() {

      const text =
        document.getElementById('bulkInput').value

      if (!text.trim()) {

        alert('Paste something first')

        return
      }

      const items =
        text.split(/\d+\./).filter(item => item.trim())

      items.forEach(item => {

        const clean =
          item.trim()

        const firstSentence =
          clean.split('।')[0]

        mysteries.unshift({
          title: firstSentence,
          description: clean,
          priority: 'Medium',
          solved: false
        })

      })

      saveMysteries()

      renderMysteries()

      alert(items.length + ' mysteries imported!')

      document.getElementById('bulkInput').value = ''
    }

২৪. ভাইরাল হওয়ার নেশায় আত্মহত্যা।

৪৯. ইনস্টাগ্রাম রিলস ও নৈতিক অবক্ষয়।

৫০. ডিজিটাল লিটারেসি বা জ্ঞানের অভাব।

      document.getElementById('bulkInput').value =
        sample

      alert('50 Bangladesh mysteries loaded!')
    }

    renderMysteries()

  </script>

</body>

</html>
