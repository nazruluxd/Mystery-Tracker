<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mystery Tracker</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: { extend: { colors: { slate: { 850: '#1e293b' } } } }
        }
    </script>

    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-auth-compat.js"></script>

    <style>
        body { background-color: #0d1117; color: #cbd5e1; margin: 0; font-family: system-ui, -apple-system, sans-serif; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        // --- FIREBASE INITIALIZATION ---
        const firebaseConfig = {
            apiKey: "AIzaSyBmsAClSWTfopqVJd8myG7vqQDSd9Z2XkA",
            authDomain: "mystery-fff8d.firebaseapp.com",
            projectId: "mystery-fff8d",
            storageBucket: "mystery-fff8d.firebasestorage.app",
            messagingSenderId: "1082125532602",
            appId: "1:1082125532602:web:33b205e3047200d95d3183"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        
        const db = firebase.firestore();
        const auth = firebase.auth();

        // --- SVG ICON COMPONENTS ---
        const IconSearch = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>;
        const IconPlus = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>;
        const IconTrash = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>;
        const IconEdit = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>;
        const IconCheck = () => <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>;
        const IconAlert = () => <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>;

        // --- MAIN APP COMPONENT ---
        const { useState, useEffect } = React;

        function App() {
            const [user, setUser] = useState(null);
            const [mysteries, setMysteries] = useState([]);
            const [title, setTitle] = useState('');
            const [description, setDescription] = useState('');
            const [editingId, setEditingId] = useState(null);
            const [editTitle, setEditTitle] = useState('');
            const [editDescription, setEditDescription] = useState('');

            // Authenticate Anonymously
            useEffect(() => {
                auth.signInAnonymously().catch(err => console.error("Auth Error:", err));
                const unsubscribe = auth.onAuthStateChanged(user => setUser(user));
                return () => unsubscribe();
            }, []);

            // Fetch Data
            useEffect(() => {
                if (!user) return;
                const unsubscribe = db.collection('mysteries')
                    .orderBy('createdAt', 'desc')
                    .onSnapshot(snapshot => {
                        const data = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                        setMysteries(data);
                    });
                return () => unsubscribe();
            }, [user]);

            // Add Mystery
            const handleAdd = (e) => {
                e.preventDefault();
                if (!title.trim() || !description.trim()) return;
                db.collection('mysteries').add({
                    title: title.trim(),
                    description: description.trim(),
                    status: 'unsolved',
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });
                setTitle('');
                setDescription('');
            };

            // Delete Mystery
            const handleDelete = (id) => {
                db.collection('mysteries').doc(id).delete();
            };

            // Toggle Status
            const handleToggle = (id, currentStatus) => {
                db.collection('mysteries').doc(id).update({
                    status: currentStatus === 'solved' ? 'unsolved' : 'solved'
                });
            };

            // Edit Functions
            const startEdit = (m) => {
                setEditingId(m.id);
                setEditTitle(m.title);
                setEditDescription(m.description);
            };

            const saveEdit = (id) => {
                db.collection('mysteries').doc(id).update({
                    title: editTitle,
                    description: editDescription
                });
                setEditingId(null);
            };

            return (
                <div className="min-h-screen bg-[#0d1117] selection:bg-emerald-500/30 pb-12">
                    {/* Header */}
                    <header className="border-b border-slate-800 bg-[#161b22] sticky top-0 z-10 px-4 py-4">
                        <div className="max-w-3xl mx-auto flex items-center justify-between">
                            <div className="flex items-center gap-3">
                                <div className="bg-emerald-500/10 p-2 rounded-lg border border-emerald-500/20 text-emerald-400">
                                    <IconSearch />
                                </div>
                                <div>
                                    <h1 className="text-slate-100 font-semibold text-lg leading-tight">Mystery Tracker</h1>
                                    <p className="text-xs text-slate-500 font-mono">Global Board</p>
                                </div>
                            </div>
                        </div>
                    </header>

                    <main className="max-w-3xl mx-auto px-4 mt-8">
                        {/* Input Form */}
                        <section className="mb-8 bg-[#161b22] border border-slate-800 rounded-xl overflow-hidden shadow-xl">
                            <div className="bg-slate-800/30 px-5 py-3 border-b border-slate-800 flex items-center gap-2">
                                <span className="text-emerald-400"><IconPlus /></span>
                                <h2 className="text-sm font-medium text-slate-200">Log New Mystery</h2>
                            </div>
                            <form onSubmit={handleAdd} className="p-5 flex flex-col gap-4">
                                <input
                                    type="text" value={title} onChange={e => setTitle(e.target.value)}
                                    placeholder="Mystery Heading..." required
                                    className="w-full bg-[#0d1117] border border-slate-800 rounded-lg px-4 py-2.5 text-slate-100 focus:outline-none focus:border-emerald-500/50 font-medium"
                                />
                                <textarea
                                    value={description} onChange={e => setDescription(e.target.value)}
                                    placeholder="Detailed description..." rows="3" required
                                    className="w-full bg-[#0d1117] border border-slate-800 rounded-lg px-4 py-3 text-slate-300 focus:outline-none focus:border-emerald-500/50 resize-y text-sm"
                                />
                                <div className="flex justify-end">
                                    <button type="submit" className="bg-emerald-600 hover:bg-emerald-500 text-white px-5 py-2 rounded-lg text-sm font-medium transition-colors">
                                        Submit Entry
                                    </button>
                                </div>
                            </form>
                        </section>

                        {/* List View */}
                        <div className="space-y-4">
                            {mysteries.map(m => (
                                <div key={m.id} className={`group bg-[#161b22] border rounded-xl overflow-hidden transition-all duration-200 ${m.status === 'solved' ? 'border-emerald-500/20 bg-emerald-500/[0.02]' : 'border-slate-800'}`}>
                                    {editingId === m.id ? (
                                        <div className="p-5 bg-slate-800/20 flex flex-col gap-3">
                                            <input type="text" value={editTitle} onChange={e => setEditTitle(e.target.value)} className="w-full bg-[#0d1117] border border-slate-700 rounded-lg px-3 py-2 text-slate-100" />
                                            <textarea value={editDescription} onChange={e => setEditDescription(e.target.value)} rows="2" className="w-full bg-[#0d1117] border border-slate-700 rounded-lg px-3 py-2 text-slate-300 text-sm" />
                                            <div className="flex justify-end gap-2 mt-2">
                                                <button onClick={() => setEditingId(null)} className="px-3 py-1.5 text-slate-400 hover:bg-slate-800 rounded text-sm">Cancel</button>
                                                <button onClick={() => saveEdit(m.id)} className="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white rounded text-sm">Save</button>
                                            </div>
                                        </div>
                                    ) : (
                                        <div className="p-5 flex justify-between gap-4">
                                            <div className="flex-1">
                                                <div className="mb-2">
                                                    {m.status === 'solved' 
                                                        ? <span className="inline-flex items-center gap-1.5 text-xs font-medium px-2 py-0.5 rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/20"><IconCheck /> Solved</span>
                                                        : <span className="inline-flex items-center gap-1.5 text-xs font-medium px-2 py-0.5 rounded-full bg-amber-500/10 text-amber-400 border border-amber-500/20"><IconAlert /> Unsolved</span>
                                                    }
                                                </div>
                                                <h3 className={`text-lg font-medium mb-1 ${m.status === 'solved' ? 'text-slate-400' : 'text-slate-100'}`}>{m.title}</h3>
                                                <p className="text-slate-400 text-sm whitespace-pre-wrap">{m.description}</p>
                                            </div>
                                            
                                            <div className="flex items-start gap-1 opacity-100 sm:opacity-0 sm:group-hover:opacity-100 transition-opacity">
                                                <button onClick={() => handleToggle(m.id, m.status)} className={`p-2 rounded hover:bg-slate-800 ${m.status === 'solved' ? 'text-amber-400' : 'text-emerald-400'}`}>
                                                    {m.status === 'solved' ? <IconAlert /> : <IconCheck />}
                                                </button>
                                                <button onClick={() => startEdit(m)} className="p-2 text-slate-400 hover:text-blue-400 hover:bg-slate-800 rounded">
                                                    <IconEdit />
                                                </button>
                                                <button onClick={() => handleDelete(m.id)} className="p-2 text-slate-400 hover:text-rose-400 hover:bg-slate-800 rounded">
                                                    <IconTrash />
                                                </button>
                                            </div>
                                        </div>
                                    )}
                                </div>
                            ))}
                        </div>
                    </main>
                </div>
            );
        }

        // Render the app
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
