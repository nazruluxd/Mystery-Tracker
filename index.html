<!DOCTYPE html>
<html lang="bn">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Mystery Tracker Bangladesh</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body {
      background: linear-gradient(135deg, #020617, #0f172a, #1e293b);
      min-height: 100vh;
      color: white;
      font-family: Arial, sans-serif;
    }

    .glass {
      background: rgba(255,255,255,0.06);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255,255,255,0.08);
    }

    input,
    textarea,
    select {
      color: white;
    }
  </style>
</head>

<body>

<div class="max-w-7xl mx-auto p-6">

  <!-- HEADER -->

  <div class="text-center mb-10">

    <h1 class="text-5xl font-bold mb-4">
      🔍 Mystery Tracker Bangladesh
    </h1>

    <p class="text-slate-300 text-lg">
      বাংলাদেশের ভাইরাল ও রহস্যময় ইস্যু ট্র্যাকার
    </p>

  </div>

  <!-- ADD -->

  <div class="glass rounded-3xl p-6 mb-8">

    <h2 class="text-2xl font-bold mb-5">
      Add Mystery
    </h2>

    <div class="grid md:grid-cols-3 gap-4">

      <input
        id="title"
        type="text"
        placeholder="Mystery title"
        class="bg-slate-900/70 border border-slate-700 rounded-xl p-3 outline-none"
      >

      <select
        id="priority"
        class="bg-slate-900/70 border border-slate-700 rounded-xl p-3 outline-none"
      >
        <option>Low</option>
        <option>Medium</option>
        <option>High</option>
      </select>

      <button
        id="addBtn"
        class="bg-cyan-500 hover:bg-cyan-600 rounded-xl p-3 font-bold"
      >
        Add Mystery
      </button>

    </div>

    <textarea
      id="description"
      placeholder="Description"
      class="w-full mt-4 bg-slate-900/70 border border-slate-700 rounded-xl p-4 outline-none h-32"
    ></textarea>

  </div>

  <!-- BULK -->

  <div class="glass rounded-3xl p-6 mb-8">

    <div class="flex justify-between flex-wrap gap-4 mb-4">

      <h2 class="text-2xl font-bold">
        Bulk Import
      </h2>

      <button
        id="sampleBtn"
        class="bg-purple-500 hover:bg-purple-600 px-5 py-3 rounded-xl font-bold"
      >
        Auto Load Sample
      </button>

    </div>

    <textarea
      id="bulkInput"
      placeholder="Paste mysteries here"
      class="w-full h-72 bg-slate-900/70 border border-slate-700 rounded-xl p-4 outline-none"
    ></textarea>

    <button
      id="importBtn"
      class="mt-4 bg-green-500 hover:bg-green-600 px-6 py-3 rounded-xl font-bold"
    >
      Import From Text
    </button>

  </div>

  <!-- SEARCH -->

  <div class="glass rounded-2xl p-5 mb-8">

    <input
      id="searchInput"
      type="text"
      placeholder="Search mysteries..."
      class="w-full bg-slate-900/70 border border-slate-700 rounded-xl p-3 outline-none"
    >

  </div>

  <!-- STATS -->

  <div class="grid md:grid-cols-3 gap-4 mb-8">

    <div class="glass rounded-2xl p-6 text-center">
      <p class="text-slate-300 mb-2">Total</p>
      <h2 id="totalCount" class="text-4xl font-bold">0</h2>
    </div>

    <div class="glass rounded-2xl p-6 text-center">
      <p class="text-slate-300 mb-2">Solved</p>
      <h2 id="solvedCount" class="text-4xl font-bold text-green-400">0</h2>
    </div>

    <div class="glass rounded-2xl p-6 text-center">
      <p class="text-slate-300 mb-2">Unsolved</p>
      <h2 id="unsolvedCount" class="text-4xl font-bold text-red-400">0</h2>
    </div>

  </div>

  <!-- LIST -->

  <div
    id="mysteryList"
    class="grid md:grid-cols-2 gap-6"
  ></div>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";

import {
  getFirestore,
  collection,
  addDoc,
  getDocs,
  deleteDoc,
  doc
}
from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";

const firebaseConfig = {

  apiKey: "AIzaSyBmsAClSWTfopqVJd8myG7vqQDSd9Z2XkA",

  authDomain: "mystery-fff8d.firebaseapp.com",

  projectId: "mystery-fff8d",

  storageBucket: "mystery-fff8d.firebasestorage.app",

  messagingSenderId: "1082125532602",

  appId: "1:1082125532602:web:33b205e3047200d95d3183"
};

const app =
  initializeApp(firebaseConfig);

const db =
  getFirestore(app);

var mysteries = [];

async function loadMysteries() {

  mysteries = [];

  const querySnapshot =
    await getDocs(
      collection(db, "mysteries")
    );

  querySnapshot.forEach(function(docItem) {

    var data =
      docItem.data();

    data.firebaseId =
      docItem.id;

    mysteries.push(data);
  });

  renderMysteries();
}

function updateStats() {

  var solved =
    mysteries.filter(function(item) {
      return item.solved;
    }).length;

  document.getElementById('totalCount').innerText =
    mysteries.length;

  document.getElementById('solvedCount').innerText =
    solved;

  document.getElementById('unsolvedCount').innerText =
    mysteries.length - solved;
}

async function addMystery() {

  var title =
    document.getElementById('title').value.trim();

  var description =
    document.getElementById('description').value.trim();

  var priority =
    document.getElementById('priority').value;

  if (!title || !description) {

    alert('Please fill all fields');

    return;
  }

  try {

    const docRef =
      await addDoc(
        collection(db, "mysteries"),
        {
          title: title,
          description: description,
          priority: priority,
          solved: false
        }
      );

    mysteries.unshift({
      firebaseId: docRef.id,
      title: title,
      description: description,
      priority: priority,
      solved: false
    });

    renderMysteries();

    document.getElementById('title').value = '';

    document.getElementById('description').value = '';

  } catch(error) {

    console.error(error);

    alert("Firebase save failed");
  }
}

async function deleteMystery(index) {

  var confirmDelete =
    confirm('Delete this mystery?');

  if (!confirmDelete) {
    return;
  }

  try {

    await deleteDoc(
      doc(
        db,
        "mysteries",
        mysteries[index].firebaseId
      )
    );

    mysteries.splice(index, 1);

    renderMysteries();

  } catch(error) {

    console.error(error);
  }
}

function renderMysteries() {

  var container =
    document.getElementById('mysteryList');

  var search =
    document.getElementById('searchInput')
      .value
      .toLowerCase();

  container.innerHTML = '';

  mysteries.forEach(function(mystery, index) {

    var titleMatch =
      mystery.title.toLowerCase().indexOf(search) !== -1;

    var descMatch =
      mystery.description.toLowerCase().indexOf(search) !== -1;

    if (!titleMatch && !descMatch) {
      return;
    }

    var priorityClass =
      'bg-green-500/20 text-green-300';

    if (mystery.priority === 'Medium') {

      priorityClass =
        'bg-yellow-500/20 text-yellow-300';
    }

    if (mystery.priority === 'High') {

      priorityClass =
        'bg-red-500/20 text-red-300';
    }

    var card =
      document.createElement('div');

    card.className =
      'glass rounded-3xl p-6';

    card.innerHTML =

      '<div class="flex flex-wrap gap-2 items-center mb-5">' +

      '<h2 class="text-3xl font-bold leading-tight">' +
      mystery.title +
      '</h2>' +

      '<span class="px-3 py-1 rounded-full text-sm ' +
      priorityClass +
      '">' +
      mystery.priority +
      '</span>' +

      '</div>' +

      '<p class="text-slate-300 leading-8 text-lg whitespace-pre-wrap">' +
      mystery.description +
      '</p>' +

      '<div class="flex flex-wrap gap-3 mt-8">' +

      '<button data-index="' + index + '" class="deleteBtn bg-red-500 hover:bg-red-600 px-4 py-2 rounded-xl font-bold">Delete</button>' +

      '</div>';

    container.appendChild(card);
  });

  updateStats();

  var deleteButtons =
    document.querySelectorAll('.deleteBtn');

  deleteButtons.forEach(function(button) {

    button.addEventListener(
      'click',
      async function() {

        var index =
          this.getAttribute('data-index');

        await deleteMystery(index);
      }
    );
  });
}

async function importBulkText() {

  var text =
    document.getElementById('bulkInput').value;

  if (!text.trim()) {

    alert('Paste something first');

    return;
  }

  var items =
    text.split(/[০-৯]+\./);

  for (var i = 0; i < items.length; i++) {

    var clean =
      items[i].trim();

    if (!clean) {
      continue;
    }

    var parts =
      clean.split(':');

    var title = '';
    var description = '';

    if (parts.length > 1) {

      title =
        parts[0].trim();

      description =
        parts.slice(1).join(':').trim();

    } else {

      title =
        clean.substring(0, 60);

      description =
        clean;
    }

    await addDoc(
      collection(db, "mysteries"),
      {
        title: title,
        description: description,
        priority: 'Medium',
        solved: false
      }
    );
  }

  await loadMysteries();

  document.getElementById('bulkInput').value = '';

  alert('Imported successfully!');
}

}

document
  .getElementById('addBtn')
  .addEventListener('click', addMystery);

document
  .getElementById('importBtn')
  .addEventListener('click', importBulkText);

document
  .getElementById('sampleBtn')
  .addEventListener('click', loadSample);

document
  .getElementById('searchInput')
  .addEventListener('keyup', renderMysteries);

loadMysteries();

</script>

</body>
</html>
