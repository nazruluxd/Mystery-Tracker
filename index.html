<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="description" content="Mystery Tracker"/>
  <title>🔍 Mystery Tracker</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      min-height: 100vh;
      color: white;
      font-family: Arial, sans-serif;
    }

    .glass {
      backdrop-filter: blur(20px);
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.1);
    }

    .fade-in {
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0px);
      }
    }
  </style>
</head>

<body>
  <button
  onclick="bulkImport()"
  class="bg-purple-500 hover:bg-purple-600 transition-all rounded-xl p-3 font-bold w-full mt-3"
>
  Bulk Import Bangladesh Mysteries
</button>

  <div class="max-w-5xl mx-auto p-6">

    <div class="text-center mb-10">
      <h1 class="text-5xl font-bold mb-4">
        🔍 Mystery Tracker
      </h1>

      <p class="text-slate-300 text-lg">
        Track your unanswered questions and mysteries
      </p>
    </div>

    <div class="glass rounded-2xl p-6 mb-8">

      <div class="grid md:grid-cols-3 gap-4">

        <input
          id="title"
          type="text"
          placeholder="Mystery title..."
          class="bg-slate-900/60 border border-slate-700 rounded-xl p-3 outline-none"
        />

        <select
          id="priority"
          class="bg-slate-900/60 border border-slate-700 rounded-xl p-3 outline-none"
        >
          <option>Low</option>
          <option>Medium</option>
          <option>High</option>
        </select>

        <button
          onclick="addMystery()"
          class="bg-cyan-500 hover:bg-cyan-600 transition-all rounded-xl p-3 font-bold"
        >
          Add Mystery
        </button>

      </div>

      <textarea
        id="description"
        placeholder="Describe your mystery..."
        class="w-full mt-4 bg-slate-900/60 border border-slate-700 rounded-xl p-4 outline-none h-32"
      ></textarea>

    </div>

    <div class="grid md:grid-cols-3 gap-4 mb-8">

      <div class="glass rounded-2xl p-6 text-center">
        <h2 class="text-slate-300 text-sm mb-2">Total Mysteries</h2>
        <p id="totalCount" class="text-4xl font-bold">0</p>
      </div>

      <div class="glass rounded-2xl p-6 text-center">
        <h2 class="text-slate-300 text-sm mb-2">Solved</h2>
        <p id="solvedCount" class="text-4xl font-bold text-green-400">0</p>
      </div>

      <div class="glass rounded-2xl p-6 text-center">
        <h2 class="text-slate-300 text-sm mb-2">Unsolved</h2>
        <p id="unsolvedCount" class="text-4xl font-bold text-red-400">0</p>
      </div>

    </div>

    <div id="mysteryList" class="space-y-4"></div>

  </div>

  <script>

    function bulkImport() {

  const bulkData = [
    {
      title: "স্বপ্ন পূরণের বাইক রহস্য",
      description: "নিজের শখের বাইক বিক্রি করতে গিয়ে কান্নায় ভেঙে পড়া এক যুবকের ভিডিও ভাইরাল। রহস্য হলো, কে সেই অজ্ঞাত পরিচয় দানকারী ব্যক্তি যিনি তাকে বাইকটি আবার কিনে দিয়েছেন?",
      priority: "High"
    },

    {
      title: "মেট গালায় বাংলাদেশি তারকাদের ভুয়া উপস্থিতি",
      description: "এআই দিয়ে তৈরি মেট গালায় বাংলাদেশি সেলিব্রিটিদের ছবি ভাইরাল হয়েছে, যা অনেকে সত্যি বলে বিশ্বাস করেছেন।",
      priority: "Medium"
    },

    {
      title: "ফ্লোরিডায় বাংলাদেশি ছাত্রী বৃষ্টি হত্যাকাণ্ড",
      description: "যুক্তরাষ্ট্রে পিএইচডি শিক্ষার্থী নাহিদা সুলতানা বৃষ্টির রহস্যজনক মৃত্যু নিয়ে উত্তাল সোশ্যাল মিডিয়া।",
      priority: "High"
    },

    {
      title: "কিউট অপরাধীর ফ্যানডম",
      description: "মাদকসহ গ্রেফতার হওয়া এক তরুণীর ছবি ভাইরাল হওয়ার পর সাধারণ মানুষের ক্ষোভ থেকে ক্রাশে রূপান্তরের মনস্তাত্ত্বিক রহস্য।",
      priority: "Medium"
    },

    {
      title: "নিখোঁজ উদ্ভাবকের গল্প",
      description: "এক তরুণ উদ্ভাবকের কাজ ভাইরাল হওয়ার পর সরকারি সাহায্য ঘোষণার ঠিক পরপরই তার জনসমক্ষে না আসা নিয়ে রহস্য।",
      priority: "High"
    },

    {
      title: "পুরানো ভিডিওর ফাঁদ",
      description: "কুষ্টিয়ায় কয়েক বছরের পুরনো ভিডিও নতুন বলে প্রচার করে গণপিটুনির ঘটনা।",
      priority: "High"
    },

    {
      title: "এআই ভয়েস ক্লোনিং স্ক্যাম",
      description: "পরিচিত মানুষের গলার আওয়াজ নকল করে টাকা হাতিয়ে নেওয়ার নতুন ডিজিটাল প্রতারণা।",
      priority: "High"
    },

    {
      title: "সাইবার সিকিউরিটি আইন ২০২৬",
      description: "রাস্তায় ভিডিও করলেই জেল হওয়ার গুজব এবং এর আসল সত্য নিয়ে বিভ্রান্তি।",
      priority: "Medium"
    },

    {
      title: "প্রথম H5N1 রোগী নিয়ে গুজব",
      description: "সরকারি বার্তার আগেই কোনো শিশুর বার্ড ফ্লুতে আক্রান্ত হওয়ার ভাইরাল পোস্ট।",
      priority: "Medium"
    },

    {
      title: "রহস্যময় ইউটিউব চ্যানেল",
      description: "গভীর রাতে রহস্যজনক লাইভ করা কিছু চ্যানেলের হঠাৎ জনপ্রিয়তা বৃদ্ধি।",
      priority: "Low"
    }
  ]

  mysteries.push(...bulkData)

  saveMysteries()

  renderMysteries()

  alert("10 mysteries imported successfully!")
}

    let mysteries = JSON.parse(localStorage.getItem('mysteries')) || []

    function saveMysteries() {
      localStorage.setItem('mysteries', JSON.stringify(mysteries))
    }

    function updateStats() {

      document.getElementById('totalCount').innerText = mysteries.length

      const solved = mysteries.filter(m => m.solved).length

      document.getElementById('solvedCount').innerText = solved

      document.getElementById('unsolvedCount').innerText =
        mysteries.length - solved
    }

    function renderMysteries() {

      const container = document.getElementById('mysteryList')

      container.innerHTML = ''

      mysteries.reverse().forEach((mystery, index) => {

        const div = document.createElement('div')

        div.className =
          'glass rounded-2xl p-6 fade-in'

        div.innerHTML = `
          <div class="flex justify-between items-start gap-4">

            <div class="flex-1">

              <div class="flex items-center gap-3 mb-3">

                <h2 class="text-2xl font-bold">
                  ${mystery.title}
                </h2>

                <span class="
                  px-3 py-1 rounded-full text-sm
                  ${
                    mystery.priority === 'High'
                      ? 'bg-red-500/20 text-red-300'
                      : mystery.priority === 'Medium'
                      ? 'bg-yellow-500/20 text-yellow-300'
                      : 'bg-green-500/20 text-green-300'
                  }
                ">
                  ${mystery.priority}
                </span>

              </div>

              <p class="text-slate-300 whitespace-pre-wrap">
                ${mystery.description}
              </p>

            </div>

            <div class="flex flex-col gap-2">

              <button
                onclick="toggleSolved(${index})"
                class="
                  px-4 py-2 rounded-lg font-semibold
                  ${
                    mystery.solved
                      ? 'bg-green-500 hover:bg-green-600'
                      : 'bg-slate-700 hover:bg-slate-600'
                  }
                "
              >
                ${mystery.solved ? 'Solved' : 'Mark Solved'}
              </button>

              <button
                onclick="deleteMystery(${index})"
                class="bg-red-500 hover:bg-red-600 px-4 py-2 rounded-lg font-semibold"
              >
                Delete
              </button>

            </div>

          </div>
        `

        container.appendChild(div)

      })

      mysteries.reverse()

      updateStats()
    }

    function addMystery() {

      const title = document.getElementById('title').value.trim()

      const description =
        document.getElementById('description').value.trim()

      const priority =
        document.getElementById('priority').value

      if (!title || !description) {
        alert('Please fill all fields')
        return
      }

      mysteries.push({
        title,
        description,
        priority,
        solved: false
      })

      saveMysteries()
      renderMysteries()

      document.getElementById('title').value = ''
      document.getElementById('description').value = ''
    }

    function toggleSolved(index) {

      const realIndex =
        mysteries.length - 1 - index

      mysteries[realIndex].solved =
        !mysteries[realIndex].solved

      saveMysteries()
      renderMysteries()
    }

    function deleteMystery(index) {

      const realIndex =
        mysteries.length - 1 - index

      mysteries.splice(realIndex, 1)

      saveMysteries()
      renderMysteries()
    }

    renderMysteries()

  </script>

</body>
</html>
