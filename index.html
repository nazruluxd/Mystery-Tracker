<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mystery Tracker Bangladesh</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: { 
                extend: { 
                    colors: { 
                        app: {
                            bg: '#0F151F',
                            card: '#161D2A',
                            input: '#0B111A',
                            border: '#2A3441',
                            cyan: '#2CB1BC',
                            purple: '#A855F7',
                            green: '#22C55E',
                            red: '#EF4444'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                        bengali: ['Noto Sans Bengali', 'sans-serif']
                    }
                } 
            }
        }
    </script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Bengali:wght@400;500;600&display=swap" rel="stylesheet">

    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-auth-compat.js"></script>

    <style>
        body { background-color: #0F151F; color: #cbd5e1; margin: 0; }
        /* Custom scrollbar for dark theme */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0F151F; }
        ::-webkit-scrollbar-thumb { background: #2A3441; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #374151; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        // --- FIREBASE INITIALIZATION ---
        const firebaseConfig = {
            apiKey: "AIzaSyBmsAClSWTfopqVJd8myG7vqQDSd9Z2XkA",
            authDomain: "mystery-fff8d.firebaseapp.com",
            projectId: "mystery-fff8d",
            storageBucket: "mystery-fff8d.firebasestorage.app",
            messagingSenderId: "1082125532602",
            appId: "1:1082125532602:web:33b205e3047200d95d3183"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        
        const db = firebase.firestore();
        const auth = firebase.auth();

        // --- ICONS ---
        const IconTrash = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 6h18"></path><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path></svg>;
        const IconCheck = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>;
        const IconX = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>;

        const { useState, useEffect } = React;

        function App() {
            // State
            const [user, setUser] = useState(null);
            const [mysteries, setMysteries] = useState([]);
            
            // Add Form State
            const [title, setTitle] = useState('');
            const [description, setDescription] = useState('');
            const [priority, setPriority] = useState('Low');

            // Bulk Import State
            const [bulkText, setBulkText] = useState('');

            // Search State
            const [searchQuery, setSearchQuery] = useState('');

            // 1. Authentication
            useEffect(() => {
                auth.signInAnonymously().catch(err => console.error("Auth Error:", err));
                const unsubscribe = auth.onAuthStateChanged(user => setUser(user));
                return () => unsubscribe();
            }, []);

            // 2. Fetch Data
            useEffect(() => {
                if (!user) return;
                const unsubscribe = db.collection('mysteries')
                    .orderBy('createdAt', 'desc')
                    .onSnapshot(snapshot => {
                        const data = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                        setMysteries(data);
                    });
                return () => unsubscribe();
            }, [user]);

            // --- HANDLERS ---
            const handleAdd = (e) => {
                if (e) e.preventDefault();
                if (!title.trim() || !description.trim()) return;
                
                db.collection('mysteries').add({
                    title: title.trim(),
                    description: description.trim(),
                    priority: priority,
                    status: 'unsolved',
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });
                setTitle('');
                setDescription('');
            };

            const handleToggleStatus = (id, currentStatus) => {
                db.collection('mysteries').doc(id).update({
                    status: currentStatus === 'solved' ? 'unsolved' : 'solved'
                });
            };

            const handleDelete = (id) => {
                if(window.confirm('Are you sure you want to delete this issue?')) {
                    db.collection('mysteries').doc(id).delete();
                }
            };

            const loadSampleData = () => {
                setBulkText(
                    "Sample Title 1 | High | This is a description of the first sample issue.\n\n" +
                    "Sample Title 2 | Low | This is a description of the second sample issue."
                );
            };

            const handleBulkImport = () => {
                if (!bulkText.trim()) return;
                
                // Very basic parser: Split by double newline for blocks
                const blocks = bulkText.split('\n\n');
                blocks.forEach(block => {
                    // Split block by | to get Title, Priority, Description
                    const parts = block.split('|').map(p => p.trim());
                    if (parts.length >= 3) {
                        db.collection('mysteries').add({
                            title: parts[0],
                            priority: parts[1],
                            description: parts[2],
                            status: 'unsolved',
                            createdAt: firebase.firestore.FieldValue.serverTimestamp()
                        });
                    }
                });
                setBulkText('');
                alert('Bulk import complete!');
            };

            // --- DERIVED DATA ---
            const total = mysteries.length;
            const solvedCount = mysteries.filter(m => m.status === 'solved').length;
            const unsolvedCount = mysteries.filter(m => m.status === 'unsolved').length;

            const filteredMysteries = mysteries.filter(m => 
                m.title.toLowerCase().includes(searchQuery.toLowerCase()) || 
                m.description.toLowerCase().includes(searchQuery.toLowerCase())
            );

            return (
                <div className="min-h-screen pb-20 font-sans">
                    {/* Main Header */}
                    <header className="pt-12 pb-8 text-center px-4">
                        <h1 className="text-4xl font-bold text-white mb-2 flex items-center justify-center gap-3">
                            <span className="text-3xl">🔍</span> Mystery Tracker Bangladesh
                        </h1>
                        <p className="text-slate-400 font-bengali text-lg tracking-wide">
                            বাংলাদেশের ভাইরাল ও রহস্যময় ইস্যু ট্র্যাকার
                        </p>
                    </header>

                    <main className="max-w-5xl mx-auto px-4 space-y-6">
                        
                        {/* Add Mystery Section */}
                        <section className="bg-app-card border border-app-border rounded-2xl p-6 shadow-lg">
                            <h2 className="text-xl font-semibold text-white mb-6">Add Mystery</h2>
                            <form onSubmit={handleAdd} className="space-y-4">
                                <div className="grid grid-cols-1 md:grid-cols-12 gap-4">
                                    <div className="md:col-span-6">
                                        <input 
                                            type="text" 
                                            placeholder="Mystery title" 
                                            value={title}
                                            onChange={e => setTitle(e.target.value)}
                                            className="w-full bg-app-input border border-app-border rounded-lg px-4 py-3 text-white placeholder:text-slate-500 focus:outline-none focus:border-app-cyan transition-colors"
                                        />
                                    </div>
                                    <div className="md:col-span-3">
                                        <select 
                                            value={priority}
                                            onChange={e => setPriority(e.target.value)}
                                            className="w-full bg-app-input border border-app-border rounded-lg px-4 py-3 text-white focus:outline-none focus:border-app-cyan appearance-none"
                                        >
                                            <option value="Low">Low</option>
                                            <option value="Medium">Medium</option>
                                            <option value="High">High</option>
                                        </select>
                                    </div>
                                    <div className="md:col-span-3">
                                        <button 
                                            type="submit" 
                                            disabled={!title.trim() || !description.trim()}
                                            className="w-full bg-app-cyan hover:bg-[#259ba5] text-[#0F151F] font-bold rounded-lg px-4 py-3 transition-colors disabled:opacity-50"
                                        >
                                            Add Mystery
                                        </button>
                                    </div>
                                </div>
                                <textarea 
                                    placeholder="Description" 
                                    rows="4"
                                    value={description}
                                    onChange={e => setDescription(e.target.value)}
                                    className="w-full bg-app-input border border-app-border rounded-lg px-4 py-3 text-white placeholder:text-slate-500 focus:outline-none focus:border-app-cyan resize-y"
                                ></textarea>
                            </form>
                        </section>

                        {/* Bulk Import Section */}
                        <section className="bg-app-card border border-app-border rounded-2xl p-6 shadow-lg">
                            <div className="flex justify-between items-center mb-6">
                                <h2 className="text-xl font-semibold text-white">Bulk Import</h2>
                                <button 
                                    onClick={loadSampleData}
                                    className="bg-app-purple hover:bg-[#9333ea] text-white font-medium rounded-lg px-5 py-2 text-sm transition-colors"
                                >
                                    Auto Load Sample
                                </button>
                            </div>
                            <textarea 
                                placeholder="Paste mysteries here (Format: Title | Priority | Description \n\n Title | Priority | Description)" 
                                rows="6"
                                value={bulkText}
                                onChange={e => setBulkText(e.target.value)}
                                className="w-full bg-app-input border border-app-border rounded-lg px-4 py-3 text-white placeholder:text-slate-600 focus:outline-none focus:border-app-purple resize-y mb-4 font-mono text-sm"
                            ></textarea>
                            <button 
                                onClick={handleBulkImport}
                                disabled={!bulkText.trim()}
                                className="bg-app-green hover:bg-[#16a34a] text-white font-bold rounded-lg px-6 py-2.5 transition-colors disabled:opacity-50"
                            >
                                Import From Text
                            </button>
                        </section>

                        {/* Search Section */}
                        <section className="bg-app-card border border-app-border rounded-xl p-4 shadow-lg">
                            <input 
                                type="text" 
                                placeholder="Search mysteries..." 
                                value={searchQuery}
                                onChange={e => setSearchQuery(e.target.value)}
                                className="w-full bg-app-input border border-app-border rounded-lg px-4 py-3 text-white placeholder:text-slate-500 focus:outline-none focus:border-slate-500"
                            />
                        </section>

                        {/* Stats Cards */}
                        <section className="grid grid-cols-1 md:grid-cols-3 gap-6">
                            <div className="bg-app-card border border-app-border rounded-2xl p-6 flex flex-col items-center justify-center text-center shadow-lg">
                                <h3 className="text-slate-400 mb-2 font-medium">Total</h3>
                                <span className="text-4xl font-bold text-white">{total}</span>
                            </div>
                            <div className="bg-app-card border border-app-border rounded-2xl p-6 flex flex-col items-center justify-center text-center shadow-lg">
                                <h3 className="text-slate-400 mb-2 font-medium">Solved</h3>
                                <span className="text-4xl font-bold text-app-green">{solvedCount}</span>
                            </div>
                            <div className="bg-app-card border border-app-border rounded-2xl p-6 flex flex-col items-center justify-center text-center shadow-lg">
                                <h3 className="text-slate-400 mb-2 font-medium">Unsolved</h3>
                                <span className="text-4xl font-bold text-app-red">{unsolvedCount}</span>
                            </div>
                        </section>

                        {/* Divider */}
                        <div className="h-px bg-app-border my-8 w-full"></div>

                        {/* Live News Cards / Feed */}
                        <section className="space-y-4">
                            <h2 className="text-2xl font-semibold text-white mb-6">Active Dashboard</h2>
                            
                            {filteredMysteries.length === 0 ? (
                                <div className="text-center py-12 bg-app-card border border-app-border rounded-2xl">
                                    <p className="text-slate-500">No records found.</p>
                                </div>
                            ) : (
                                filteredMysteries.map(mystery => (
                                    <div key={mystery.id} className="bg-app-card border border-app-border rounded-xl overflow-hidden hover:border-slate-600 transition-colors shadow-md">
                                        <div className="p-6">
                                            <div className="flex justify-between items-start mb-4">
                                                <div>
                                                    <div className="flex items-center gap-3 mb-2">
                                                        <span className={`text-xs font-bold px-2 py-1 rounded bg-app-input border border-app-border ${
                                                            mystery.priority === 'High' ? 'text-app-red' : 
                                                            mystery.priority === 'Medium' ? 'text-yellow-500' : 
                                                            'text-app-cyan'
                                                        }`}>
                                                            {mystery.priority || 'Low'}
                                                        </span>
                                                        <span className={`text-xs font-bold px-2 py-1 rounded flex items-center gap-1 ${
                                                            mystery.status === 'solved' ? 'bg-[#22C55E]/10 text-app-green' : 'bg-[#EF4444]/10 text-app-red'
                                                        }`}>
                                                            {mystery.status === 'solved' ? 'SOLVED' : 'UNSOLVED'}
                                                        </span>
                                                    </div>
                                                    <h3 className={`text-xl font-semibold ${mystery.status === 'solved' ? 'text-slate-400 line-through' : 'text-white'}`}>
                                                        {mystery.title}
                                                    </h3>
                                                </div>
                                            </div>
                                            <p className="text-slate-400 whitespace-pre-wrap leading-relaxed mb-6 font-bengali">
                                                {mystery.description}
                                            </p>
                                            
                                            {/* Action Bar */}
                                            <div className="flex items-center gap-3 pt-4 border-t border-app-border/50">
                                                {mystery.status === 'unsolved' ? (
                                                    <button 
                                                        onClick={() => handleToggleStatus(mystery.id, mystery.status)}
                                                        className="flex items-center gap-2 px-4 py-2 bg-app-input hover:bg-app-green/20 text-slate-300 hover:text-app-green border border-app-border rounded-lg transition-colors text-sm font-medium"
                                                    >
                                                        <IconCheck /> Mark Solved
                                                    </button>
                                                ) : (
                                                    <button 
                                                        onClick={() => handleToggleStatus(mystery.id, mystery.status)}
                                                        className="flex items-center gap-2 px-4 py-2 bg-app-input hover:bg-app-red/20 text-slate-300 hover:text-app-red border border-app-border rounded-lg transition-colors text-sm font-medium"
                                                    >
                                                        <IconX /> Mark Unsolved
                                                    </button>
                                                )}
                                                
                                                <button 
                                                    onClick={() => handleDelete(mystery.id)}
                                                    className="flex items-center gap-2 px-4 py-2 bg-app-input hover:bg-app-red/20 text-slate-300 hover:text-app-red border border-app-border rounded-lg transition-colors text-sm font-medium ml-auto"
                                                >
                                                    <IconTrash /> Delete
                                                </button>
                                            </div>
                                        </div>
                                    </div>
                                ))
                            )}
                        </section>

                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
