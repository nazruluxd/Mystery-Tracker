<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NewsIntel // Investigative Network</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: { 
                extend: { 
                    colors: { 
                        intel: {
                            bg: '#05070a',
                            card: '#0d1117',
                            input: '#010409',
                            border: '#30363d',
                            cyan: '#3fb1ff',
                            rose: '#f85149',
                            emerald: '#3fb950'
                        }
                    }
                } 
            }
        }
    </script>

    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-auth-compat.js"></script>

    <style>
        body { background-color: #05070a; color: #c9d1d9; margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
        .glass { background: rgba(13, 17, 23, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        // --- FIREBASE CONFIG ---
        const firebaseConfig = {
            apiKey: "AIzaSyBmsAClSWTfopqVJd8myG7vqQDSd9Z2XkA",
            authDomain: "mystery-fff8d.firebaseapp.com",
            projectId: "mystery-fff8d",
            storageBucket: "mystery-fff8d.firebasestorage.app",
            messagingSenderId: "1082125532602",
            appId: "1:1082125532602:web:33b205e3047200d95d3183"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        // --- ICONS (SVG) ---
        const IconNews = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M4 22h16a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2v16a2 2 0 0 1-2 2Zm0 0a2 2 0 0 1-2-2v-9c0-1.1.9-2 2-2h2"/><path d="M18 14h-8"/><path d="M15 18h-5"/><path d="M10 6h8v4h-8V6Z"/></svg>;
        const IconPlus = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>;
        const IconTrash = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 6h18"></path><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path></svg>;

        const { useState, useEffect, useMemo } = React;

        function App() {
            const [view, setView] = useState('feed');
            const [mysteries, setMysteries] = useState([]);
            const [search, setSearch] = useState('');
            const [formData, setFormData] = useState({ title: '', description: '', category: 'Breaking News', location: '', urgency: 'Medium' });

            useEffect(() => {
                auth.signInAnonymously().catch(e => console.error(e));
                const unsubscribe = db.collection('mysteries').orderBy('createdAt', 'desc').onSnapshot(snap => {
                    setMysteries(snap.docs.map(doc => ({ id: doc.id, ...doc.data() })));
                });
                return () => unsubscribe();
            }, []);

            const handleSubmit = (e) => {
                e.preventDefault();
                db.collection('mysteries').add({
                    ...formData,
                    status: 'Unsolved',
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });
                setFormData({ title: '', description: '', category: 'Breaking News', location: '', urgency: 'Medium' });
                setView('feed');
            };

            const filtered = mysteries.filter(m => m.title?.toLowerCase().includes(search.toLowerCase()));

            return (
                <div className="min-h-screen">
                    {/* Navigation */}
                    <nav className="sticky top-0 z-50 glass px-6 py-4 flex items-center justify-between border-b border-white/10">
                        <div className="flex items-center gap-3 cursor-pointer" onClick={() => setView('feed')}>
                            <div className="p-2 bg-intel-cyan/20 rounded-lg text-intel-cyan"><IconNews /></div>
                            <h1 className="text-xl font-black tracking-tighter text-white">NEWS<span className="text-intel-cyan">INTEL</span></h1>
                        </div>
                        <button onClick={() => setView('submit')} className="bg-white text-black px-4 py-2 rounded-full text-xs font-bold hover:bg-slate-200 transition-all flex items-center gap-2">
                            <IconPlus /> REPORT MYSTERY
                        </button>
                    </nav>

                    <main className="max-w-6xl mx-auto p-6">
                        {view === 'feed' ? (
                            <div className="space-y-8">
                                <div className="relative">
                                    <input 
                                        type="text" placeholder="Search investigation archives..." 
                                        className="w-full bg-intel-input border border-intel-border p-4 rounded-xl text-sm focus:border-intel-cyan outline-none"
                                        onChange={(e) => setSearch(e.target.value)}
                                    />
                                </div>

                                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                                    {filtered.map(m => (
                                        <div key={m.id} className="glass p-6 rounded-3xl hover:border-white/20 transition-all flex flex-col h-full">
                                            <div className="flex justify-between mb-4">
                                                <span className="text-[10px] font-bold px-2 py-1 bg-white/5 rounded border border-white/10 uppercase tracking-widest">{m.category}</span>
                                                <span className="text-[10px] font-bold text-intel-rose uppercase tracking-widest">{m.urgency}</span>
                                            </div>
                                            <h3 className="text-lg font-bold text-white mb-3 leading-tight">{m.title}</h3>
                                            <p className="text-sm text-slate-400 line-clamp-4 mb-6 leading-relaxed">{m.description}</p>
                                            <div className="mt-auto pt-4 border-t border-white/5 flex justify-between items-center text-[10px] font-mono text-slate-500 uppercase">
                                                <span>{m.location || 'GLOBAL'}</span>
                                                <button onClick={() => db.collection('mysteries').doc(m.id).delete()} className="text-slate-600 hover:text-intel-rose transition-colors"><IconTrash /></button>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        ) : (
                            <div className="max-w-2xl mx-auto py-10">
                                <h2 className="text-3xl font-black text-white mb-8">Submit News Intel</h2>
                                <form onSubmit={handleSubmit} className="glass p-8 rounded-[2rem] space-y-6">
                                    <div className="space-y-2">
                                        <label className="text-[11px] font-bold text-slate-500 uppercase tracking-widest ml-1">News Heading</label>
                                        <input 
                                            required type="text" value={formData.title}
                                            onChange={e => setFormData({...formData, title: e.target.value})}
                                            className="w-full bg-intel-input border border-intel-border p-4 rounded-xl text-lg font-bold text-white focus:border-intel-cyan outline-none"
                                            placeholder="Enter impactful headline..."
                                        />
                                    </div>
                                    <div className="space-y-2">
                                        <label className="text-[11px] font-bold text-slate-500 uppercase tracking-widest ml-1">News Details</label>
                                        <textarea 
                                            required rows="6" value={formData.description}
                                            onChange={e => setFormData({...formData, description: e.target.value})}
                                            className="w-full bg-intel-input border border-intel-border p-4 rounded-xl text-sm leading-relaxed text-slate-300 focus:border-intel-cyan outline-none resize-none"
                                            placeholder="Provide evidence and descriptions..."
                                        />
                                    </div>
                                    <div className="grid grid-cols-2 gap-4">
                                        <select value={formData.category} onChange={e => setFormData({...formData, category: e.target.value})} className="bg-intel-input border border-intel-border p-4 rounded-xl text-xs font-bold text-white outline-none">
                                            <option>Breaking News</option><option>Social Viral</option><option>UFO/Military</option><option>Paranormal</option>
                                        </select>
                                        <input type="text" placeholder="Location" value={formData.location} onChange={e => setFormData({...formData, location: e.target.value})} className="bg-intel-input border border-intel-border p-4 rounded-xl text-xs font-bold text-white outline-none" />
                                    </div>
                                    <button type="submit" className="w-full bg-intel-cyan text-black font-black py-4 rounded-xl hover:scale-[0.98] transition-all">BROADCAST INTEL</button>
                                </form>
                            </div>
                        )}
                    </main>

                    <footer className="mt-20 border-t border-white/5 p-10 text-center">
                        <p className="text-[9px] font-mono font-bold text-slate-800 tracking-[0.4em] uppercase italic">
                            © 2026 NEWS INTEL NETWORK // ENCRYPTED CHANNEL // NO LOGS KEPT
                        </p>
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
